<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班表</title>
  <style>
    @page { size: A4 landscape; margin: 10mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; color: #1f2933; background: #fff;
      font: 12px/1.4 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
    .bar button {
      height: 34px; padding: 0 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff;
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .bar .hint { color: #6b7785; flex: 1; }
    .bar .back { background: #eef2f7; color: #1f2933; }
    .wrapx { overflow-x: auto; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .legend { display: flex; gap: 10px; margin-bottom: 8px; color: #6b7785; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #b7b7b7; padding: 6px 4px; text-align: center; vertical-align: middle; }
    thead th { background: #93c47d; font-size: 12px; }
    thead th b { display: block; font-size: 14px; }
    thead th span { font-weight: 400; }
    th.name, td.name { width: 92px; text-align: left; padding-left: 8px; background: #d9ead3; font-weight: 700; font-size: 13px; }
    td { height: 34px; }
    .s { display: block; white-space: nowrap; font-size: 13px; font-weight: 600; }
    .s + .s { margin-top: 2px; }
    .tag {
      display: inline-block; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 4px; margin-right: 3px;
      color: color-mix(in srgb, var(--c) 70%, #1f2933); background: color-mix(in srgb, var(--c) 22%, #fff);
    }
    .off { color: #cc0000; font-weight: 700; }
    tbody tr:nth-child(even) td:not(.name) { background: #fafbfc; }
    .foot { margin-top: 8px; color: #9aa5b1; font-size: 10px; text-align: right; }
    @media print { body { padding: 0; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <button id="backBtn" class="back">‹ 返回</button>
    <span class="hint">按「列印／存成 PDF」，iPhone／iPad 在列印畫面點「分享」→「儲存到檔案」就是 PDF。</span>
    <button id="printBtn">列印／存成 PDF</button>
  </div>
  <h1 id="title"></h1>
  <div class="legend" id="legend"></div>
  <div class="wrapx"><table>
    <thead id="head"></thead>
    <tbody id="body"></tbody>
  </table></div>
  <div class="foot" id="printed"></div>
  <script src="chrome-shim.js"></script>
  <script src="print.js"></script>
  <script>document.getElementById('backBtn').onclick = () => (history.length > 1 ? history.back() : (location.href = './'));</script>
</body>
</html>
